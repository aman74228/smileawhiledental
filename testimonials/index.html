<!-- Testimonials · WP: Reviews CPT archive (or Google reviews feed) with category taxonomy -->
<section class="section testimonials" aria-labelledby="reviews-list-title">
  <div class="container">
    <h2 class="visually-hidden" id="reviews-list-title">All reviews</h2>
    <div class="filter" data-review-filter data-reveal>
      <p class="filter__label" id="filter-label">Filter by treatment</p>
      <div class="filter__chips" role="group" aria-labelledby="filter-label">
        <button class="chip" type="button" aria-pressed="true" data-filter="all">All</button>
        {{#each reviews.categories as cat}}<button class="chip" type="button" aria-pressed="false" data-filter="{{cat}}">{{cat}}</button>{{/each}}
      </div>
      <p class="visually-hidden" role="status" aria-live="polite" data-filter-status></p>
    </div>
    <div class="testimonials__grid" data-review-list>
      {{#each reviews.items as r}}
      <div class="testimonials__cell" data-review-cell data-reveal><!-- @include src/partials/review-card.html --></div>
      {{/each}}
    </div>
    <div class="reviews__ctas" data-reveal>
      <a class="link" href="{{site.reviewsLink.url}}" target="_blank" rel="noopener" data-dummy="true" data-note="Google Business Profile reviews URL">{{site.reviewsLink.label}}<span aria-hidden="true"> ↗</span><span class="visually-hidden"> (opens in a new tab)</span></a>
    </div>
  </div>
</section>
