<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <!-- Glass icon set · 32×32 grid · 1.5px stroke (non-scaling) · light from top-left
       Fill: teal-25 → #B9E3EF → #4FBCD6 diagonal. Stroke: currentColor (teal-800 by default).
       Inner highlight: white 1.5px arc, top-left of every primary shape. -->
  <defs>
    <linearGradient id="gi-fill" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F3FAFC"/>
      <stop offset="0.45" stop-color="#B9E3EF"/>
      <stop offset="1" stop-color="#4FBCD6"/>
    </linearGradient>
    <linearGradient id="gi-fill-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1F4F9"/>
    </linearGradient>
    <linearGradient id="gi-fill-solid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1691AB"/>
      <stop offset="1" stop-color="#005E70"/>
    </linearGradient>
  </defs>

  <!-- General dentistry: tooth -->
  <symbol id="gi-general" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gi-fill)" d="M10.2 4.75c-3 0-4.95 2.5-4.95 5.6 0 3.3 1.5 5.3 2.3 8.4.85 3.4 1.2 8.5 3.45 8.5 2.2 0 2.3-6 5-6s2.8 6 5 6c2.25 0 2.6-5.1 3.45-8.5.8-3.1 2.3-5.1 2.3-8.4 0-3.1-1.95-5.6-4.95-5.6-2.5 0-3.4 1.6-5.8 1.6s-3.3-1.6-5.8-1.6Z"/>
    <path stroke="#fff" stroke-opacity=".95" d="M8.6 9.3c.35-1.15 1.2-1.85 2.3-1.95"/>
  </symbol>

  <!-- Dental implants: crown + abutment + screw -->
  <symbol id="gi-implants" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gi-fill)" d="M9.75 4.25h12.5A2.75 2.75 0 0 1 25 7c0 3.7-2.3 6.25-5.2 6.25h-7.6C9.3 13.25 7 10.7 7 7a2.75 2.75 0 0 1 2.75-2.75Z"/>
    <path fill="url(#gi-fill-soft)" d="M12.75 13.25h6.5v2.5h-6.5z"/>
    <path fill="url(#gi-fill)" d="M12 15.75h8l-.85 8.1c-.07.7-.37 1.36-.85 1.87L16 28.25l-2.3-2.53a3.2 3.2 0 0 1-.85-1.87L12 15.75Z"/>
    <path d="M12.55 18.9h6.9M12.9 22h6.2"/>
    <path stroke="#fff" stroke-opacity=".95" d="M9.6 7.6c.2-.8.8-1.3 1.6-1.4"/>
  </symbol>

  <!-- Emergency dentistry: tooth + solid plus badge -->
  <symbol id="gi-emergency" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-1.6 -0.6) scale(.92)"><path vector-effect="non-scaling-stroke" fill="url(#gi-fill)" d="M10.2 4.75c-3 0-4.95 2.5-4.95 5.6 0 3.3 1.5 5.3 2.3 8.4.85 3.4 1.2 8.5 3.45 8.5 2.2 0 2.3-6 5-6s2.8 6 5 6c2.25 0 2.6-5.1 3.45-8.5.8-3.1 2.3-5.1 2.3-8.4 0-3.1-1.95-5.6-4.95-5.6-2.5 0-3.4 1.6-5.8 1.6s-3.3-1.6-5.8-1.6Z"/>
    <path vector-effect="non-scaling-stroke" stroke="#fff" stroke-opacity=".95" d="M8.6 9.3c.35-1.15 1.2-1.85 2.3-1.95"/></g>
    <circle cx="23" cy="22.75" r="7" fill="#fff" stroke="none"/>
    <circle cx="23" cy="22.75" r="5.75" fill="url(#gi-fill-solid)"/>
    <path stroke="#fff" d="M23 20v5.5M20.25 22.75h5.5"/>
  </symbol>

  <!-- Periodontal: teeth emerging from gum line -->
  <symbol id="gi-periodontal" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gi-fill-soft)" d="M6.25 15.5V9.25a3.75 3.75 0 0 1 7.5 0v6.25M18.25 15.5V9.25a3.75 3.75 0 0 1 7.5 0v6.25"/>
    <path fill="url(#gi-fill)" d="M3.75 16.25c2.3 0 3.4-2.75 6.75-2.75s3.6 2.75 5.5 2.75 2.15-2.75 5.5-2.75 4.45 2.75 6.75 2.75v7a4 4 0 0 1-4 4h-16.5a4 4 0 0 1-4-4v-7Z"/>
    <path stroke="#fff" stroke-opacity=".95" d="M8.4 8.6c.25-.75.8-1.25 1.5-1.4"/>
    <path stroke="#fff" stroke-opacity=".7" d="M6.5 19.6c.9-.55 1.8-.85 2.8-.9"/>
  </symbol>

  <!-- Cosmetic: tooth with veneer face -->
  <symbol id="gi-cosmetic" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gi-fill)" d="M10.2 4.75c-3 0-4.95 2.5-4.95 5.6 0 3.3 1.5 5.3 2.3 8.4.85 3.4 1.2 8.5 3.45 8.5 2.2 0 2.3-6 5-6s2.8 6 5 6c2.25 0 2.6-5.1 3.45-8.5.8-3.1 2.3-5.1 2.3-8.4 0-3.1-1.95-5.6-4.95-5.6-2.5 0-3.4 1.6-5.8 1.6s-3.3-1.6-5.8-1.6Z"/>
    <path fill="url(#gi-fill-soft)" d="M5.6 12.2c3.3 1.9 6.8 2.8 10.4 2.8s7.1-.9 10.4-2.8c.2-.6.35-1.2.35-1.85 0-3.1-1.95-5.6-4.95-5.6-2.5 0-3.4 1.6-5.8 1.6s-3.3-1.6-5.8-1.6c-3 0-4.95 2.5-4.95 5.6 0 .65.1 1.25.35 1.85Z"/>
    <path stroke="#fff" stroke-opacity=".95" d="M8.6 9.3c.35-1.15 1.2-1.85 2.3-1.95M13.2 8.1h.01"/>
  </symbol>

  <!-- Orthodontics: clear aligner arch (top view) -->
  <symbol id="gi-orthodontics" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gi-fill)" d="M4.75 26.25C4.75 13.1 9.6 4.75 16 4.75s11.25 8.35 11.25 21.5h-5C22.25 16 19.6 10 16 10s-6.25 6-6.25 16.25h-5Z"/>
    <path d="M6.6 15.9l3.6 1.25M9.7 10l2.9 2.35M16 4.75v5.25M22.3 10l-2.9 2.35M25.4 15.9l-3.6 1.25"/>
    <path stroke="#fff" stroke-opacity=".95" d="M8.1 12.3c.9-2.1 2.1-3.8 3.5-4.9"/>
  </symbol>

  <!-- ===== Technology set (same grid, stroke, fill and light direction) ===== -->

  <!-- 3D CBCT: gantry ring on a stand -->
  <symbol id="gi-cbct" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gi-fill)" fill-rule="evenodd" d="M16 4.75a10.75 10.75 0 1 1 0 21.5 10.75 10.75 0 0 1 0-21.5Zm0 5a5.75 5.75 0 1 0 0 11.5 5.75 5.75 0 0 0 0-11.5Z"/>
    <path d="M11 29.25h10M16 26.25v3"/>
    <circle cx="16" cy="15.5" r="1.6" fill="currentColor" stroke="none"/>
    <path stroke="#fff" stroke-opacity=".95" d="M8.6 11.2c.8-1.8 2.2-3.2 4-4"/>
  </symbol>

  <!-- Digital radiography: sensor with a tooth image -->
  <symbol id="gi-xray" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.25" y="5.25" width="21.5" height="21.5" rx="5" fill="url(#gi-fill)"/>
    <path fill="url(#gi-fill-soft)" d="M12.9 10.75c-1.6 0-2.65 1.3-2.65 2.95 0 1.75.8 2.8 1.2 4.4.45 1.8.65 4.15 1.85 4.15s1.2-3.15 2.7-3.15 1.5 3.15 2.7 3.15 1.4-2.35 1.85-4.15c.4-1.6 1.2-2.65 1.2-4.4 0-1.65-1.05-2.95-2.65-2.95-1.35 0-1.8.85-3.1.85s-1.75-.85-3.1-.85Z"/>
    <path stroke="#fff" stroke-opacity=".95" d="M8.4 9.6c.35-1.05 1.1-1.7 2.1-1.85"/>
  </symbol>

  <!-- 3D intraoral scanner: wand with scan window -->
  <symbol id="gi-scanner" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(35 16 16)">
      <rect x="12.75" y="3.25" width="6.5" height="25.5" rx="3.25" fill="url(#gi-fill)"/>
      <rect x="14.25" y="6" width="3.5" height="4.5" rx="1.2" fill="url(#gi-fill-soft)"/>
      <path stroke="#fff" stroke-opacity=".95" d="M14.4 13.5v4"/>
    </g>
    <path d="M23.6 4.4c1.4.4 2.6 1.6 3 3M22.4 7.1c.7.2 1.3.8 1.5 1.5"/>
  </symbol>

  <!-- Intraoral camera: camera body + lens -->
  <symbol id="gi-camera" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gi-fill)" d="M8.75 9.25h2.4l1.6-2.75h6.5l1.6 2.75h2.4a3.5 3.5 0 0 1 3.5 3.5v9.5a3.5 3.5 0 0 1-3.5 3.5H8.75a3.5 3.5 0 0 1-3.5-3.5v-9.5a3.5 3.5 0 0 1 3.5-3.5Z"/>
    <circle cx="16" cy="17.25" r="4.75" fill="url(#gi-fill-soft)"/>
    <circle cx="16" cy="17.25" r="1.75"/>
    <path stroke="#fff" stroke-opacity=".95" d="M8.2 13.2c.2-.8.8-1.3 1.6-1.4"/>
  </symbol>

  <!-- CEREC same-day crowns: crown + clock badge -->
  <symbol id="gi-cerec" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gi-fill)" d="M8.75 6.25h12.5A2.75 2.75 0 0 1 24 9c0 3.7-2.3 6.25-5.2 6.25h-7.6C8.3 15.25 6 12.7 6 9a2.75 2.75 0 0 1 2.75-2.75Z"/>
    <path fill="url(#gi-fill-soft)" d="M10.25 15.25c.3 3.5 1 8 2.6 8 1.5 0 1.6-4 2.15-4s.65 4 2.15 4c1.1 0 1.7-2.2 2.1-4.6"/>
    <circle cx="23" cy="22.75" r="7" fill="#fff" stroke="none"/>
    <circle cx="23" cy="22.75" r="5.75" fill="url(#gi-fill-solid)"/>
    <path stroke="#fff" d="M23 19.9v3l2 1.4"/>
    <path stroke="#fff" stroke-opacity=".95" d="M8.6 9.6c.2-.8.8-1.3 1.6-1.4"/>
  </symbol>

  <!-- Soft-tissue laser: handpiece, beam, gum line -->
  <symbol id="gi-laser" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(40 19 10)">
      <rect x="16" y="0.75" width="6" height="16.5" rx="3" fill="url(#gi-fill)"/>
      <path stroke="#fff" stroke-opacity=".95" d="M17.6 4.2v4"/>
    </g>
    <path stroke-dasharray="1.2 2.4" d="M12.9 16.3 7.6 23"/>
    <path fill="url(#gi-fill-soft)" d="M3.75 25.5c2-1.6 4.1-1.6 6.1 0s4.1 1.6 6.1 0 4.1-1.6 6.1 0 4.1 1.6 6.2 0v3.25H3.75V25.5Z"/>
  </symbol>

  <!-- Digital smile design: frame, guides and smile curve -->
  <symbol id="gi-smile-design" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.25" y="5.25" width="21.5" height="21.5" rx="5.5" fill="url(#gi-fill)"/>
    <path stroke-opacity=".45" stroke-dasharray="1.5 2" d="M16 8.5v15M8.5 13h15"/>
    <path fill="url(#gi-fill-soft)" d="M9.75 15.5c1.9 3.6 4 5.25 6.25 5.25s4.35-1.65 6.25-5.25c-4.1 1.1-8.4 1.1-12.5 0Z"/>
    <path stroke="#fff" stroke-opacity=".95" d="M8.4 9.9c.35-1.05 1.1-1.75 2.1-1.9"/>
  </symbol>

  <!-- Computer-guided anesthesia: precision dial -->
  <symbol id="gi-anesthesia" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#gi-fill)" d="M4.75 22.75a11.25 11.25 0 0 1 22.5 0v1.5a2 2 0 0 1-2 2H6.75a2 2 0 0 1-2-2v-1.5Z"/>
    <path d="M8.2 15.3l1.3 1M16 11.5v1.6M23.8 15.3l-1.3 1"/>
    <path stroke-width="2" d="M16 22.25l4.6-5.6"/>
    <circle cx="16" cy="22.25" r="1.9" fill="url(#gi-fill-solid)"/>
    <path stroke="#fff" stroke-opacity=".95" d="M7.6 18.6c.6-2 1.9-3.7 3.6-4.8"/>
  </symbol>
</svg>
