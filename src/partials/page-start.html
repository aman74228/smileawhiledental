<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="theme-color" content="#FFFFFF">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:image" content="/images/holland/dr-patel-operatory-3x2-1200.webp">

  <link rel="preload" href="/fonts/GoogleSans-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2310768A'/%3E%3C/svg%3E">

  <script>
    // Hide [data-reveal] content only when JS runs; un-hide after 3s if the
    // motion module fails to boot, so content can never stay invisible.
    document.documentElement.classList.add('js');
    // Review mode (?review=1): shows dummy-content markers and review-only tiles.
    // Default is the clean client view. Set before first paint to avoid a flash.
    if (/[?&]review=1(&|$)/.test(location.search)) document.documentElement.classList.add('review-mode');
    window.__revealFailsafe = setTimeout(function () { document.documentElement.classList.remove('js'); }, 3000);
  </script>

  <!-- LocalBusiness / Dentist schema. openingHours, email and url are intentionally
       omitted until real values replace the dummy ones in site.json. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Dentist",
    "name": "{{site.name}}",
    "telephone": "{{site.phone.tel}}",
    "image": "/images/holland/dr-patel-operatory-3x2-1200.webp",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{site.address.street}}",
      "addressLocality": "{{site.address.city}}",
      "addressRegion": "{{site.address.region}}",
      "postalCode": "{{site.address.postalCode}}",
      "addressCountry": "{{site.address.country}}"
    }
  }
  </script>
  {{#if service}}<script type="application/ld+json">{{@json service.faqSchema}}</script>{{/if}}

  <script type="module" src="/src/js/main.js"></script>
</head>
<body data-page="{{page.key}}">
  <!-- @include src/icons/glass-icons.svg -->
  <!-- @include src/icons/ui-icons.svg -->
  <!-- @include src/sections/header/header.html -->

  <main id="main" tabindex="-1">
