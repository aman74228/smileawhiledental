<!-- ===================== SECTION: meet the doctor =====================
     WP: template-parts/home/doctor.php · portrait, bio and credentials from the Team CPT (team.json here)
     Portrait: real client photo, re-cropped (mid-thigh up, straightened 1.3°).
     Bio + credentials are DUMMY sample copy (data-dummy) until the practice supplies them.
     ==================================================================== -->
<section class="section doctor" id="doctor" aria-labelledby="doctor-title" data-doctor>
  <div class="container doctor__grid">
    <figure class="doctor__figure">
      <div class="doctor__media" data-reveal-media>
        <!-- @picture dr-patel-reception portrait class="doctor__img" sizes="(min-width: 1024px) 38vw, (min-width: 768px) 60vw, 90vw" alt="Dr. Patel at the practice's reception desk" -->
      </div>
    </figure>

    <div class="doctor__content">
      <p class="eyebrow" data-reveal>Meet the doctor</p>
      <h2 class="t-h1 doctor__name" id="doctor-title" data-reveal>{{team.doctor.name}}</h2>
      <p class="doctor__role" data-reveal data-dummy="true" data-note="Confirm credential (DMD vs DDS)">{{site.doctor.credentials}} · Family &amp; cosmetic dentist</p>

      <p class="t-body-lg doctor__bio" data-reveal data-dummy="true" data-note="Dummy bio: replace with Dr. Patel's own">{{team.doctor.lede}}</p>

      <ul class="doctor__creds" role="list" aria-label="Credentials" data-reveal data-dummy="true" data-note="Dummy credentials: confirm each">
        {{#each team.doctor.credentials as c}}
        <li><svg class="doctor__tick" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9"/><path d="m6 10.3 2.6 2.6L14.2 7.4"/></svg><span>{{c}}</span></li>
        {{/each}}
      </ul>

      <div class="doctor__ctas" data-reveal>
        <a class="btn btn--primary" href="{{bookHref}}" data-magnetic>
          <span class="btn__label">Book with {{team.doctor.name}}</span>
          <span class="btn__arrow" aria-hidden="true"><svg><use href="#ui-arrow"/></svg></span>
        </a>
        <a class="link" href="/our-practice/#doctor">Read Dr. Patel's story</a>
      </div>
    </div>
  </div>
</section>
