<section class="section office" id="office" aria-labelledby="office-title">
  <div class="container">
    <div class="office__head">
      <div>
        <p class="eyebrow" data-reveal>Our office</p>
        <h2 class="t-h2 office__title" id="office-title" data-reveal>Easy to find, easy to park</h2>
      </div>
      <div class="office__intro">
        <p class="t-body-lg" data-reveal>
          <span data-placeholder="Confirm free parking at the door with client">Park right outside</span>,
          walk a few steps to the front door and check in. No long queues, and no circling for a space.
        </p>
        <a class="link office__link" href="/our-practice/#directions" data-reveal>Get directions</a>
      </div>
    </div>

    <div class="office__gallery">
      <figure class="office__item office__item--lg">
        <div class="office__frame" data-reveal-media data-parallax>
          <!-- @picture exterior-front 4x3 class="office__img" sizes="(min-width: 1440px) 1360px, 100vw" -->
        </div>
        <figcaption class="office__caption">{{site.address.singleLine}}</figcaption>
      </figure>

      <div class="office__pending review-only" aria-label="Review note">
        <p class="office__pending-title">Interior photos coming soon</p>
        <p class="office__pending-text">Reception, waiting room and treatment rooms. Shown in review mode only.</p>
      </div>
    </div>
  </div>
</section>
