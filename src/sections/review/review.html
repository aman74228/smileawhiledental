<!-- ===================== SECTION: review (single quote + Google review) =====================
     WP: template-parts/home/review.php · quote, name, star rating and reviews URL from ACF
     The content-source testimonials can't be used (one implies out-of-hours care, the other
     credits a doctor who doesn't exist), so this shows a placeholder until a real 5-star
     Google review is supplied with the patient's permission. Never edit a patient's words.
     ========================================================================================= -->
<section class="section review" id="review" aria-labelledby="review-title">
  <div class="container review__inner">
    <p class="eyebrow review__eyebrow" data-reveal>From our patients</p>
    <h2 class="visually-hidden" id="review-title">A patient review</h2>

    <figure class="review__figure">
      <svg class="review__mark" viewBox="0 0 48 36" aria-hidden="true" data-reveal><path d="M0 36V22.4C0 9.6 6.8 2.1 18.8 0l2 4.6C13.7 6.7 10.4 10.7 10 17h9.4v19H0Zm28 0V22.4C28 9.6 34.8 2.1 46.8 0l2 4.6C41.7 6.7 38.4 10.7 38 17h9.4v19H28Z"/></svg>

      <div class="review__stars" role="img" aria-label="Rated 5 out of 5" data-reveal data-placeholder="Show only if the featured review is 5 stars">
        <svg viewBox="0 0 100 18" aria-hidden="true"><g fill="currentColor"><path id="rv-star" d="M9 0l2.6 5.6 6.1.7-4.5 4.2 1.2 6L9 13.5 3.6 16.5l1.2-6L.3 6.3l6.1-.7z"/><use href="#rv-star" x="20.5"/><use href="#rv-star" x="41"/><use href="#rv-star" x="61.5"/><use href="#rv-star" x="82"/></g></svg>
      </div>

      <blockquote class="review__quote" data-reveal>
        <p data-placeholder="Paste a real 5-star Google review, 2–3 sentences, with the patient's permission">[Featured Google review: two or three sentences from a real 5-star review, used with the patient's permission.]</p>
      </blockquote>

      <figcaption class="review__cite" data-reveal>
        <span class="review__name" data-placeholder="Patient first name + last initial, with permission">[PATIENT NAME]</span>
        <span class="review__source">Google review</span>
      </figcaption>
    </figure>

    <div class="review__ctas" data-reveal>
      <a class="btn btn--primary" href="{{site.booking.href}}" data-magnetic>
        <span class="btn__label">{{site.booking.label}}</span>
        <span class="btn__arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
      </a>
      <a class="link review__more" href="{{site.reviews.url}}" target="_blank" rel="noopener" data-placeholder="Google Business Profile reviews URL needed">{{site.reviews.label}}<span aria-hidden="true"> ↗</span><span class="visually-hidden"> (opens in a new tab)</span></a>
    </div>
  </div>
</section>
