<!-- ===================== SECTION: sticky-cta (global, <1024px only) =====================
     WP: template-parts/sticky-cta.php · rendered once in footer.php
     Hidden over the hero, over [data-hide-sticky] regions (appointment form, footer)
     and while the mobile menu is open. `inert` keeps it out of the tab order when hidden.
     ====================================================================================== -->
<div class="sticky-cta" role="region" aria-label="Quick contact" data-sticky-cta inert>
  <div class="sticky-cta__inner">
    <a class="btn btn--secondary sticky-cta__btn" href="tel:{{site.phone.tel}}" aria-label="Call {{site.phone.display}}">
      <svg class="btn__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.6 2.5 4 2.3c-.9 0-1.7.8-1.6 1.7.6 5.1 4.6 9 9.6 9.6.9.1 1.7-.7 1.7-1.6l-.2-1.6c-.1-.5-.5-.9-1-1l-1.8-.4c-.4-.1-.8 0-1.1.3l-.8.8a8 8 0 0 1-3.6-3.6l.8-.8c.3-.3.4-.7.3-1.1L5.9 3c0-.3-.1-.4-.3-.5Z"/></svg>
      {{site.stickyBar.call}}
    </a>
    <a class="btn btn--primary sticky-cta__btn" href="{{site.booking.href}}">
      <span class="btn__label">{{site.stickyBar.book}}</span>
      <span class="btn__arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
    </a>
  </div>
</div>
